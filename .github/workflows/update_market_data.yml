name: Update market data

on:
  schedule:
    # Tiap 30 menit 17:05-20:35 WIB (jadwal GitHub memakai UTC), Senin-Jumat.
    # Jadwal GitHub sering molor lama, jadi dibuat banyak titik. Begitu satu run sukses,
    # run sesudahnya otomatis "data sudah terbaru, lewati" (~30 detik), jadi aman & gratis.
    # Menit :05/:35 sengaja dihindarkan dari jam bulat yang antriannya paling padat.
    - cron: "5 10 * * 1-5"
    - cron: "35 10 * * 1-5"
    - cron: "5 11 * * 1-5"
    - cron: "35 11 * * 1-5"
    - cron: "5 12 * * 1-5"
    - cron: "35 12 * * 1-5"
    - cron: "5 13 * * 1-5"
    - cron: "35 13 * * 1-5"
    # Jaring pengaman TENGAH MALAM 01:00-06:00 WIB, 6x coba (tiap jam) -- supaya kalau seluruh jadwal
    # sore di atas gagal semua (misal Yahoo lagi bermasalah pas jam bursa tutup), masih ada 6 kesempatan
    # lagi sebelum orang buka dashboard paginya. Ini yg bikin "data leaderboard ga keupdate berhari-hari
    # tanpa ketahuan" tidak akan terulang -- lihat juga langkah "Open issue on failure" di bawah.
    # WIB = UTC+7, jadi jam 01:00-06:00 WIB jatuh di jam 18:00-23:00 UTC HARI SEBELUMNYA. Supaya jendela
    # ini jalan Senin-Jumat WIB (skip Sabtu & Minggu WIB) SESUAI PERMINTAAN, hari-di-cron (UTC) dipilih
    # Minggu-Kamis (0-4) -- karena Minggu malam UTC = Senin pagi WIB, dst. Menit :15 (bukan :00) supaya
    # tidak ikut antrian jam bulat yang paling padat, sama seperti menit :05/:35 di atas.
    - cron: "15 18 * * 0-4"  # 01:15 WIB
    - cron: "15 19 * * 0-4"  # 02:15 WIB
    - cron: "15 20 * * 0-4"  # 03:15 WIB
    - cron: "15 21 * * 0-4"  # 04:15 WIB
    - cron: "15 22 * * 0-4"  # 05:15 WIB
    - cron: "15 23 * * 0-4"  # 06:15 WIB (percobaan terakhir jendela ini)
  workflow_dispatch:
    inputs:
      force:
        description: "Paksa unduh ulang walau data sudah terbaru"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # streamlit ikut dipasang karena modul screener mengimpornya (tidak dipakai untuk menjalankan web di sini)
        run: pip install pandas numpy yfinance ta streamlit

      - name: Download market data
        id: fetch
        env:
          FORCE_RUN: ${{ inputs.force }}
        run: |
          if [ "$FORCE_RUN" = "true" ]; then
            python scripts/update_market_data.py --out out --force
          else
            python scripts/update_market_data.py --out out
          fi

      - name: Publish to data branch
        if: steps.fetch.outputs.changed == 'true'
        run: |
          set -e
          mkdir -p /tmp/publish
          cp out/market_data.csv.gz out/market_data_meta.json /tmp/publish/
          for f in ihsg_history.csv screener_history.json; do
            if [ -f "out/$f" ]; then cp "out/$f" /tmp/publish/; fi
          done
          cd /tmp/publish
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "market data $(date -u +%F)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin data

      # Menjaga project Supabase gratis tidak tertidur (dijeda setelah ~7 hari tanpa aktivitas).
      # Butuh secret SUPABASE_URL dan SUPABASE_KEY (publishable key). Kalau belum diisi, langkah ini dilewati.
      - name: Keepalive Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Secret Supabase belum diisi, keepalive dilewati."
            exit 0
          fi
          code=$(curl -s -o /dev/null -m 20 -w "%{http_code}" -H "apikey: $SUPABASE_KEY" "${SUPABASE_URL%/}/rest/v1/user_data?select=user_id&limit=1" || true)
          echo "Supabase membalas HTTP ${code}"
          case "$code" in 2*) ;; *) echo "::warning::Supabase tidak membalas normal (HTTP ${code}). Cek apakah project dijeda atau key salah." ;; esac

      # Pengingat mengisi kalender libur bursa tahun depan (issue dibuat sekali, komentar tiap tanggal 1).
      - name: Calendar reminder
        if: always() && steps.fetch.outputs.calendar_alert != ''
        env:
          ALERT: ${{ steps.fetch.outputs.calendar_alert }}
        run: |
          year="${ALERT%%|*}"; level="${ALERT##*|}"
          title="Kalender libur IDX ${year} belum diisi"
          body="Kalender libur bursa ${year} belum diisi di engines/market_data.py (level: ${level}).

          1. Cari pengumuman \"Kalender Libur Bursa Tahun ${year}\" di idx.co.id (biasanya terbit September-Oktober).
          2. Tambahkan tanggalnya ke IDX_HOLIDAYS dan tahunnya ke IDX_HOLIDAY_YEARS.

          Tanpa ini hari libur dianggap hari bursa biasa: job harian bisa gagal dan penanda candle final jadi salah. Issue ini tertutup otomatis setelah kalender diisi."
          num=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"${title}\" in:title" --json number --jq '.[0].number')
          if [ -z "$num" ]; then
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          elif [ "$(date -u +%d)" = "01" ]; then
            gh issue comment "$num" --repo "${{ github.repository }}" --body "Pengingat bulanan: kalender ${year} masih belum diisi (level: ${level})."
          fi

      - name: Close calendar reminder
        if: steps.fetch.outcome == 'success' && steps.fetch.outputs.calendar_alert == ''
        run: |
          for num in $(gh issue list --repo "${{ github.repository }}" --state open --search "Kalender libur IDX belum diisi in:title" --json number,title --jq '.[] | select(.title | test("^Kalender libur IDX [0-9]+ belum diisi$")) | .number'); do
            gh issue close "$num" --repo "${{ github.repository }}" --comment "Kalender sudah terisi. Ditutup otomatis."
          done

      # Jadwal terakhir sore (20:35 WIB) ATAU terakhir jendela tengah malam (06:15 WIB) atau jalan manual
      # gagal = seluruh percobaan hari itu sudah habis, data belum terbit. Buka issue supaya kamu tahu
      # SAAT itu juga -- bukan baru sadar beberapa hari kemudian seperti sebelumnya.
      - name: Open issue on failure
        if: failure() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '35 13 * * 1-5' || github.event.schedule == '15 23 * * 0-4')
        run: |
          title="Update data harian gagal ($(date -u +%F))"
          num=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"${title}\" in:title" --json number --jq '.[0].number')
          if [ -z "$num" ]; then
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "Job update data harian gagal pada percobaan terakhir. Data di web bisa basi sampai job berikutnya berhasil. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
